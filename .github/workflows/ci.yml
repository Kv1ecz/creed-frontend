# Portão que protege a branch principal (ADR-003, secao 4.2).
# Roda a suíte completa: lint, formatação, tipos e testes.
# É obrigatório porque pre-commit pode ser contornado com --no-verify.
name: CI Front-end

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: ESLint (qualidade de código)
        run: npm run lint

      - name: Prettier (formatação)
        run: npm run format:check

      - name: TypeScript (verificação estática de tipos)
        run: npm run typecheck

      - name: Vitest (testes)
        run: npm run test:run

      # Último porque é o passo mais caro, mas indispensável: `typecheck` roda
      # tsc --noEmit só sobre o tsconfig da app, então não enxerga o
      # vite.config.ts. Um build quebrado já passou despercebido por isso.
      - name: Build de produção
        run: npm run build
